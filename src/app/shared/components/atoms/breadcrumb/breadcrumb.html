<nav aria-label="Breadcrumb">
  <ol class="breadcrumb-list">
    @for (item of data(); track $index; let last = $last) {
      <li class="breadcrumb-item" [attr.aria-current]="last ? 'page' : null">
        <span [class]="last ? 'breadcrumb-current' : 'breadcrumb-ancestor'">{{ item.name }}</span>
      </li>
    }
  </ol>
</nav>
