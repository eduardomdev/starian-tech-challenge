<div class="str-input">
  @if (label()) {
    <div class="str-input__label-row">
      <label [for]="inputId()" class="str-input__label">{{ label() }}</label>
      <ng-content select="[labelSuffix]" />
    </div>
  }

  <div class="str-input__field-wrap">
    <input
      class="str-input__field"
      [class.str-input__field--secondary]="variant() === 'secondary'"
      [class.str-input__field--invalid]="showError()"
      [class.str-input__field--has-toggle]="isPassword()"
      [strNumbersOnly]="numbersOnly()"
      [id]="inputId()"
      [type]="resolvedType()"
      [value]="value()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [required]="required()"
      [style.height]="sizeHeight()"
      [attr.maxlength]="maxLength() ?? null"
      [attr.inputmode]="numbersOnly() ? 'decimal' : null"
      [attr.aria-label]="ariaLabel() || null"
      [attr.aria-invalid]="showError() || null"
      [attr.aria-describedby]="showError() && inputId() ? inputId() + '-error' : null"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />

    @if (isPassword()) {
      <button
        type="button"
        class="str-input__toggle"
        [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="showPassword()"
        (click)="togglePassword()"
      >
        <str-icon
          [name]="showPassword() ? 'visibility_off' : 'visibility'"
          size="18"
          colorIcon="#9ca3af"
        />
      </button>
    }

    @if (showError()) {
      <span [id]="inputId() + '-error'" class="str-input__error" role="alert">
        {{ firstError() }}
      </span>
    }
  </div>
</div>
