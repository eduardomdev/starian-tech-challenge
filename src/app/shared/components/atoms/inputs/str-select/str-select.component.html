<div class="str-select">
  @if (label()) {
    <label class="str-select__label">{{ label() }}</label>
  }

  <div class="str-select__field-wrap">
    <button
      type="button"
      class="str-select__trigger"
      [class.str-select__trigger--invalid]="showError()"
      [class.str-select__trigger--open]="isOpen()"
      [attr.aria-expanded]="isOpen()"
      [attr.aria-haspopup]="'listbox'"
      [attr.aria-required]="required() ? 'true' : null"
      [attr.aria-invalid]="showError() ? 'true' : null"
      [disabled]="disabled() || null"
      (click)="toggle()"
      (keydown.arrowdown)="openAndFocusOption($event)"
      (keydown.arrowup)="openAndFocusOption($event)"
      (keydown.escape)="close()"
      (blur)="onTriggerBlur($event)"
    >
      <span
        class="str-select__trigger-text"
        [class.str-select__trigger-text--placeholder]="!value()"
      >
        {{ selectedLabel() || placeholder() }}
      </span>

      <str-icon name="expand_more" size="16" [rotate]="isOpen()" aria-hidden="true" />
    </button>

    @if (isOpen()) {
      <ul
        class="str-select__dropdown"
        role="listbox"
        [attr.aria-label]="label() || placeholder()"
        (keydown.escape)="close(); focusTrigger()"
      >
        @if (options().length === 0) {
          <li class="str-select__empty" role="presentation">Nenhuma opção disponível</li>
        } @else {
          @for (option of options(); track option.value; let i = $index) {
            <li
              role="option"
              class="str-select__option"
              [class.str-select__option--selected]="value() === option.value"
              [attr.aria-selected]="value() === option.value"
              tabindex="0"
              (click)="selectOption(option.value)"
              (keydown.enter)="selectOption(option.value)"
              (keydown.space)="selectOption(option.value); $event.preventDefault()"
              (keydown.arrowdown)="navigateOption($event, 1, i)"
              (keydown.arrowup)="navigateOption($event, -1, i)"
              (keydown.tab)="close()"
            >
              {{ option.label }}
            </li>
          }
        }
      </ul>
    }

    @if (showError()) {
      <span class="str-select__error" role="alert">
        {{ firstError() }}
      </span>
    }
  </div>
</div>
