@if (updateLoading()) {
  <app-user-edit-skeleton />
} @else {
<form [formRoot]="editForm" class="edit-form" novalidate aria-labelledby="edit-user-dialog-title">

  <header class="edit-form__header">
    <p id="edit-user-dialog-title" class="title-font-20">Editar usuário</p>
    <p class="subtitle-font-14">Usuário #{{ user.id }} · Atualize as informações abaixo.</p>
  </header>

  <div class="edit-form__fields">
    <str-input
      [formField]="editForm.username"
      label="Username"
      placeholder="Ex: johndoe"
      inputId="edit-username"
    />

    <str-input
      [formField]="editForm.email"
      label="E-mail"
      placeholder="Ex: john@email.com"
      inputId="edit-email"
    />

    <str-input
      [formField]="editForm.password"
      label="Senha"
      placeholder="Nova senha"
      inputId="edit-password"
      [type]="'password'"
    />
  </div>

  <div class="edit-form__actions">
    <str-button type="button" size="md" variant="secondary" (click)="cancel()">
      Cancelar
    </str-button>
    <str-button type="submit" size="md" [loading]="updateLoading()">
      Salvar alterações
    </str-button>
  </div>

</form>
}
