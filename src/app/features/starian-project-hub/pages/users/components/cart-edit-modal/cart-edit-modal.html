<div class="cart-form" aria-labelledby="cart-edit-dialog-title">

  <header class="cart-form__header">
    <p id="cart-edit-dialog-title" class="title-font-20">Editar carrinho</p>
    <p class="cart-form__subtitle">
      Carrinho #{{ cart.id }} · Ajuste os produtos e quantidades.
    </p>
  </header>

  <div class="cart-form__body">
    <app-cart-products-panel
      searchInputId="cart-edit-search"
      [productsLoading]="form.productsLoading()"
      [productsError]="form.productsError()"
      [filteredProducts]="form.filteredProducts()"
      [selectedItems]="form.selectedItems()"
      [allProducts]="form.allProducts()"
      [searchQuery]="form.searchQuery()"
      (searchQueryChange)="form.searchQuery.set($event)"
      (addProduct)="form.addProduct($event)"
      (removeProduct)="form.removeProduct($event)"
      (increaseQuantity)="form.increaseQuantity($event)"
      (decreaseQuantity)="form.decreaseQuantity($event)"
    >
      <app-cart-edit-skeleton skeleton />
    </app-cart-products-panel>
  </div>

  <div class="cart-form__actions">
    <str-button type="button" size="md" variant="secondary" (click)="cancel()">
      Cancelar
    </str-button>
    <str-button size="md" [loading]="updateLoading()" (click)="submit()">
      Salvar alterações
    </str-button>
  </div>

</div>
